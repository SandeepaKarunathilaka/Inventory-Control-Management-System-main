spring.application.name=inventory-system
server.port=8080

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/inventory_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

spring.jackson.serialization.write-dates-as-timestamps=false

secreteJwtString=${JWT_SECRET:local-development-jwt-secret-key-change-me}
